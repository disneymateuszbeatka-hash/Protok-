<!doctype html>
<html lang="pl" dir="ltr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0f172a" />
    <meta name="theme-color" content="#0f172a" media="(prefers-color-scheme: dark)" />
    
    <!-- PWA & Mobile Web App Capabilities -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Odbiór" />
    <meta name="application-name" content="Raport Odbioru Lokalu" />
    <meta name="msapplication-TileColor" content="#0f172a" />
    <meta name="format-detection" content="telephone=no" />

    <!-- Web App Manifest -->
    <link rel="manifest" href="/manifest.json" />

    <!-- Icons -->
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="icon" type="image/png" sizes="192x192" href="/pwa-192x192.png" />
    <link rel="icon" type="image/png" sizes="512x512" href="/pwa-512x512.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />

    <title>Raport Odbioru Lokalu</title>
    <meta name="description" content="Mobilna checklista odbioru technicznego lokalu i mieszkania z generowaniem i wysyłką raportu PDF na e-mail." />
    
    <!-- OpenGraph & Twitter -->
    <meta property="og:title" content="Raport Odbioru Lokalu" />
    <meta property="og:description" content="Mobilna checklista odbioru technicznego lokalu i mieszkania z generowaniem i wysyłką raportu PDF na e-mail." />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="/pwa-512x512.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Raport Odbioru Lokalu" />
    <meta name="twitter:description" content="Mobilna checklista odbioru technicznego lokalu i mieszkania z generowaniem i wysyłką raportu PDF na e-mail." />
    <meta name="twitter:image" content="/pwa-512x512.png" />

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">

    <!-- Direct Service Worker registration for PWABuilder / crawler detection -->
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js', { scope: '/' }).catch(function(e) {
            console.log('SW registration note:', e);
          });
        });
      }
    </script>
  </head>
  <body class="bg-[#0f172a] text-[#f8fafc] antialiased selection:bg-amber-500 selection:text-slate-950 min-h-screen">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
